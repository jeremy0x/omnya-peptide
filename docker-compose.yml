version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnya-peptide-postgres
    restart: always
    environment:
      POSTGRES_USER: omnya
      POSTGRES_PASSWORD: omnyapassword
      POSTGRES_DB: omnya_peptide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: omnya-peptide-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://omnya:omnyapassword@postgres:5432/omnya_peptide?schema=public
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
